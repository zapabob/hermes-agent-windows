name: Apply Watchdog Authority GREEN

on:
  push:
    branches:
      - fix/remove-watchdog-backend-authority-20260917

permissions:
  contents: write

jobs:
  apply-green:
    if: "${{ github.event.head_commit.message == 'ci: apply watchdog authority GREEN' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify staged GREEN payload
        shell: bash
        run: |
          set -euo pipefail
          echo '9419972b89e5a7d345bcf941bcb3d39199703e23ebdc49b46ef8f344b3470ff5  .github/watchdog_fix.gz.b64.00' | sha256sum -c -
          echo '499c5d4c7abe7cdf0f6c597f741118fb6c1b5c3316af90fca1d2a6840ea6762a  .github/watchdog_fix.gz.b64.01' | sha256sum -c -
          echo '8953d44afb83ba449ef48445ba618a9a36d99539283855fab0bf2fd104f88fdd  .github/watchdog_fix.gz.b64.02' | sha256sum -c -
          echo '666aeaacb8beb76bbd0d2c1797621738e7c3d8f079ebc96ca3ad40e362c44fc0  .github/watchdog_fix.gz.b64.03' | sha256sum -c -
          echo 'c6acc2a2c9a5f6d5014285cba81bbeb3f5a92dd52a45105a85e07918ae7bbb05  .github/watchdog_fix.gz.b64.04' | sha256sum -c -
          cat .github/watchdog_fix.gz.b64.0* > /tmp/watchdog_fix.py.gz.b64
          echo '3c763742080357039f6cf5e4a9096f2d055444a09dab5140d3473b4a227a47db  /tmp/watchdog_fix.py.gz.b64' | sha256sum -c -
          base64 -d /tmp/watchdog_fix.py.gz.b64 | gzip -d > /tmp/apply_watchdog_authority_fix.py
          echo '851a797b7f4cf8e1dfa12e889de7c8810a2a3fbafab8204477bb387e5f92d4a1  /tmp/apply_watchdog_authority_fix.py' | sha256sum -c -
      - name: Apply production GREEN transform
        run: python /tmp/apply_watchdog_authority_fix.py
      - name: Verify single-owner source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          go = root / 'scripts' / 'windows' / 'watchdog-go'
          launcher = (root / 'scripts' / 'windows' / 'Start-HermesGoWatchdog.ps1').read_text(encoding='utf-8')
          production = '\n'.join((go / p).read_text(encoding='utf-8') for p in ('main.go', 'config.go', 'watchdog.go', 'process_windows.go'))
          for forbidden in ('PrewarmBackend', 'EnsureHealthy()', 'NewBackendManager', 'desktop-backend.json', 'HERMES_WATCHDOG_MANAGED', 'managed-backend-port', 'prewarm-backend'):
              assert forbidden not in production + launcher, forbidden
          assert not (go / 'backend.go').exists()
          process = (go / 'process_windows.go').read_text(encoding='utf-8')
          assert 'func startPackagedDesktop(cfg Config, logger *Logger, mutationAllowed func() bool) bool' in process
          assert 'desktopLaunchEnv(cfg)' in process
          for forbidden in ('BackendManager', 'readLaunchManifest', 'stopOrphanDesktopBackends', 'restartPackagedDesktop'):
              assert forbidden not in process, forbidden
          print('single-owner source contract: PASS')
          PY
      - name: Align public removal wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = 'Legacy backend-prewarm compatibility paths remain deprecated and disabled in the supported topology; they are excluded from Tier-1 qualification and do not confer supported runtime authority.'
          new = 'The legacy watchdog-owned backend-prewarm compatibility path has been removed from production code; the watchdog cannot create, claim, replace, restart, or publish credentials for the Desktop Python backend.'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Remove temporary transformation assets
        shell: bash
        run: |
          rm -f .github/watchdog_fix.b64.* .github/watchdog_fix.gz.b64.*
          rm -f .github/workflows/watchdog-authority-red.yml
      - name: Refresh carry metrics
        shell: bash
        run: |
          python -m pip install pyyaml
          python scripts/downstream/carry_metrics.py
          python scripts/downstream/carry_metrics.py --check
      - name: Commit production GREEN tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix(windows): remove watchdog Desktop backend authority [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
