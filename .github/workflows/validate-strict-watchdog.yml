name: Validate Strict Watchdog

on:
  push:
    branches:
      - ci/validate-strict-watchdog-20260917

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/windows/watchdog-go/go.mod
          cache-dependency-path: scripts/windows/watchdog-go/go.sum
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Authority Python contracts
        run: |
          python -m pytest --noconftest -o 'addopts=' tests/test_go_watchdog_runtime_authority.py tests/test_go_watchdog_privilege_authority.py tests/test_go_watchdog_launcher_authority.py tests/test_go_watchdog_architecture_contract.py tests/test_go_watchdog_task_registration.py tests/downstream/test_windows_contracts.py -q
          exit $LASTEXITCODE
      - name: Full watchdog Go suite
        working-directory: scripts/windows/watchdog-go
        run: |
          go test -count=1 ./...
          exit $LASTEXITCODE
      - name: Watchdog vet
        working-directory: scripts/windows/watchdog-go
        run: go vet ./...
      - name: PowerShell AST
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/windows/Start-HermesGoWatchdog.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | Format-List; exit 1 }
          Write-Host 'PowerShell AST: PASS'
