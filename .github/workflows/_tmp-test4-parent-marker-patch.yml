name: Temporary TEST4 parent marker patch

on:
  push:
    branches:
      - fix/test4-parent-incarnation-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: fix/test4-parent-incarnation-gate
      - name: Patch TEST 4 parent process incarnation gate
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/windows/tests/Test-HermesDesktopLifecycle.ps1')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          if 'function Get-LiveParentStartMarker' in text:
              raise SystemExit('parent marker gate already present; refusing duplicate patch')

          parent_helper = r'''
          function Get-LiveParentStartMarker([int]$TargetPid) {
              # Mirrors parent-process-identity.ts: Electron parent identity is
              # winms:<milliseconds since Unix epoch>, not the backend win:<FILETIME ticks> marker.
              try {
                  $p = Get-Process -Id $TargetPid -ErrorAction Stop
                  $utc = $p.StartTime.ToUniversalTime()
                  $milliseconds = [DateTimeOffset]::new($utc).ToUnixTimeMilliseconds()
                  if ($milliseconds -le 0) { return $null }
                  return "winms:$milliseconds"
              } catch {
                  return $null
              }
          }
          '''.strip('\n')

          replace_once(
              '\nfunction Invoke-Test4IdentityGates {',
              '\n' + parent_helper + '\n\nfunction Invoke-Test4IdentityGates {',
              'insert parent marker helper',
          )

          replace_once(
              '    $ledgerEntry = $gateResult.ledgerEntry\n    $ledgerStartMarker = [string]$ledgerEntry.startMarker\n',
              '    $ledgerEntry = $gateResult.ledgerEntry\n    $ledgerStartMarker = [string]$ledgerEntry.startMarker\n    $ledgerParentStartMarker = [string]$ledgerEntry.parentStartMarker\n',
              'capture parent marker',
          )

          initial_parent_gate = r'''
              # Gate 6 (first): parent Desktop process incarnation must match the
              # recorded winms marker. Matching numeric parent PID alone is insufficient.
              $liveParentMarkerPre = Get-LiveParentStartMarker -TargetPid $dPid
              if (-not $liveParentMarkerPre) {
                  Write-Warning ("TEST4 cycle {0} REFUSED: live parentStartMarker probe failed (Desktop PID={1})" -f $c, $dPid)
                  Write-TqdmProgress -Activity "TEST 4 (Crash Recovery)" -Current $c -Total $actualCrashCycles -Stopwatch $crashTqdmSw -Status ("Cycle {0}: live_parent_marker_probe_failed" -f $c)
                  continue
              }
              if ($liveParentMarkerPre -ne $ledgerParentStartMarker) {
                  Write-Warning ("TEST4 cycle {0} REFUSED: parentStartMarker mismatch (live={1}, ledger={2})" -f $c, $liveParentMarkerPre, $ledgerParentStartMarker)
                  Write-TqdmProgress -Activity "TEST 4 (Crash Recovery)" -Current $c -Total $actualCrashCycles -Stopwatch $crashTqdmSw -Status ("Cycle {0}: parentStartMarker_mismatch" -f $c)
                  continue
              }
          '''.strip('\n')

          replace_once(
              '\n    Write-Step ("TEST4 cycle {0}: all 5 identity gates PASSED (PID={1}, nonce={2}, startMarker={3}, parentPid={4})" -f $c, $oldBackendPid, $ledgerEntry.nonce, $liveMarkerPre, $dPid)\n',
              '\n' + initial_parent_gate + '\n\n    Write-Step ("TEST4 cycle {0}: all 6 identity gates PASSED (PID={1}, nonce={2}, startMarker={3}, parentPid={4}, parentStartMarker={5})" -f $c, $oldBackendPid, $ledgerEntry.nonce, $liveMarkerPre, $dPid, $liveParentMarkerPre)\n',
              'insert initial parent gate',
          )

          final_parent_gate = r'''
              # Gate 6 (revalidation immediately before Stop-Process): repeat the
              # parent incarnation check so PID reuse cannot cross the destructive boundary.
              $liveParentMarkerFinal = Get-LiveParentStartMarker -TargetPid $dPid
              if (-not $liveParentMarkerFinal -or $liveParentMarkerFinal -ne $ledgerParentStartMarker) {
                  Write-Warning ("TEST4 cycle {0} REFUSED: pre-termination parentStartMarker revalidation failed (live={1}, ledger={2})" -f $c, $liveParentMarkerFinal, $ledgerParentStartMarker)
                  Write-TqdmProgress -Activity "TEST 4 (Crash Recovery)" -Current $c -Total $actualCrashCycles -Stopwatch $crashTqdmSw -Status ("Cycle {0}: toctou_parent_guard_triggered" -f $c)
                  continue
              }
          '''.strip('\n')

          replace_once(
              '\n    # All gates passed — terminate the specific verified incarnation\n    Stop-Process -Id $oldBackendPid -Force -ErrorAction SilentlyContinue\n',
              '\n' + final_parent_gate + '\n\n    # All gates passed — terminate the specific verified backend incarnation owned by the verified Desktop incarnation\n    Stop-Process -Id $oldBackendPid -Force -ErrorAction SilentlyContinue\n',
              'insert final parent TOCTOU gate',
          )

          text = text.replace(
              '#   Gate 5. Live startMarker probe matches ledger startMarker\n#            (revalidated immediately before Stop-Process to resist PID-reuse TOCTOU).\n',
              '#   Gate 5. Live backend startMarker matches ledger startMarker.\n#   Gate 6. Live Desktop parentStartMarker matches ledger parentStartMarker.\n#            Both are revalidated immediately before Stop-Process to resist PID-reuse TOCTOU.\n',
              1,
          )

          path.write_text(text, encoding='utf-8', newline='\n')

          required = [
              'function Get-LiveParentStartMarker',
              'return "winms:$milliseconds"',
              'parentStartMarker_mismatch',
              '$liveParentMarkerPre',
              '$liveParentMarkerFinal',
              'toctou_parent_guard_triggered',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'missing required patched tokens: {missing}')
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add scripts/windows/tests/Test-HermesDesktopLifecycle.ps1
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'test(windows): verify TEST 4 parent process incarnation [parent-marker-patched]'
          git push origin HEAD:fix/test4-parent-incarnation-gate
