name: PR132 isolated gate-order closeout
on:
  push:
    branches: [bot/pr132-final-gate-order-20260917]
    paths: [.github/workflows/pr132-gate-order-closeout.yml]
permissions:
  contents: read
concurrency:
  group: pr132-isolated-gate-order-closeout
  cancel-in-progress: false
jobs:
  closeout:
    if: github.repository == 'zapabob/hermes-agent-windows' && github.ref == 'refs/heads/bot/pr132-final-gate-order-20260917'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      EXPECTED_MAIN: cc17504cb8719556bd200fb381eb770edba17a70
      ORIGINAL_PR_HEAD: 4914966219e621dfe70a12cf4712504ef1658f0f
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: false
      - name: Install locked test dependencies
        shell: pwsh
        run: |
          uv python install 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --python 3.11 --extra dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay hash-pinned closeout with current boundary checks
        shell: pwsh
        run: |
          @'
          import hashlib, os, subprocess, zipfile
          from pathlib import Path
          import yaml
          root = Path.cwd()
          python = str(root / '.venv/Scripts/python.exe')
          workflow = '.github/workflows/pr132-gate-order-closeout.yml'
          # Reuse only our own immutable, already-reviewed one-shot source.
          # This avoids copying/reinterpreting the RED/GREEN or native test steps.
          source = subprocess.check_output(['git', 'show', 'e2d957ea41534d4deaefdfd6bdc5bd670ae55e2b:' + workflow])
          assert hashlib.sha1(f'blob {len(source)}\0'.encode() + source).hexdigest() == '7405acae636eda3a94addd51da1f3344b7242e39'
          steps = yaml.safe_load(source)['jobs']['closeout']['steps']
          names = [
              'Merge the pinned main without discarding runtime changes',
              'RED then GREEN for final gate ordering and logging',
              'Native PowerShell parse and final gate refusal behavior',
              'Commit only the scoped fix and regenerate committed-tree metrics',
          ]
          for name in names:
              matches = [step for step in steps if step.get('name') == name]
              assert len(matches) == 1
              step = matches[0]
              code = step['run']
              if name == names[-1]:
                  old = "subprocess.run([python, 'scripts/downstream/check_boundaries.py'], check=True)"
                  assert code.count(old) == 1
                  # Exact layout contract from the pinned main fork-cicd.yml.
                  new = "assert not Path('platform').is_dir(), 'Legacy platform directory must not exist'\n"
                  new += "for boundary in ('downstream/compat/hermes', 'downstream/platform/windows', 'downstream/services'):\n"
                  new += "    assert Path(boundary).is_dir(), f'Missing compatibility boundary: {boundary}'\n"
                  new += "subprocess.run([python, '-m', 'pytest', 'tests/downstream/test_ci_contracts.py', '-q'], check=True)"
                  code = code.replace(old, new)
              print('Executing:', name, flush=True)
              command = [python, '-c', code] if step['shell'] == 'python' else ['pwsh', '-NoProfile', '-NonInteractive', '-Command', code]
              subprocess.run(command, check=True)
          evidence = Path(os.environ['RUNNER_TEMP']) / 'pr132-closeout-evidence'
          files = ['scripts/windows/tests/Test-HermesDesktopLifecycle.ps1', 'tests/hermes_cli/test_test4_parent_incarnation_gate_contract.py', '_docs/carry-surface-20260826.json', '_docs/carry-surface-20260826.md']
          with zipfile.ZipFile(evidence / 'candidate-files.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for file in files:
                  archive.writestr(file, subprocess.check_output(['git', 'show', 'HEAD:' + file]))
          '@ | .\.venv\Scripts\python.exe -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish only to the isolated helper branch
        shell: pwsh
        env:
          CLOSEOUT_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:' + $env:CLOSEOUT_TOKEN))
          try {
            git push origin HEAD:refs/heads/bot/pr132-final-gate-order-20260917
            if ($LASTEXITCODE -ne 0) { throw 'Isolated branch push failed' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0, Env:CLOSEOUT_TOKEN -ErrorAction SilentlyContinue
          }
      - name: Upload exact candidate and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr132-gate-order-closeout-evidence
          path: ${{ runner.temp }}/pr132-closeout-evidence/
          if-no-files-found: error
          retention-days: 14
