name: Router repair CPython 3.13 dependencies
on:
  push:
    branches: [ci/router-dogfood-fix-snapshot-20260923]
    paths: [.github/workflows/router-fix-extra-wheels.yml]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public wheels for the local test interpreter
        run: |
          python -m pip download --only-binary=:all: --python-version 3.13 --platform manylinux2014_x86_64 --implementation cp --abi cp313 --no-deps --dest wheels jiter==0.11.1 distro==1.9.0 sniffio==1.3.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: router-repair-extra-wheels
          path: wheels/
          retention-days: 3
