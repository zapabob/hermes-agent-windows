name: TEST4 carry refresh helper

on:
  push:
    branches:
      - bot/test4-carry-refresh-helper

permissions:
  contents: write

jobs:
  refresh-target:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: fix/test4-parent-incarnation-gate
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra dev
      - name: Regenerate carry metrics for target branch
        shell: pwsh
        run: |
          uv run --no-sync python scripts/downstream/carry_metrics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python scripts/downstream/carry_metrics.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit refreshed metrics to target branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'Target metrics already current.'
            exit 0
          fi
          git add _docs/carry-surface-20260826.json _docs/carry-surface-20260826.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs(downstream): refresh carry metrics for final TEST 4 tree'
          git push origin HEAD:fix/test4-parent-incarnation-gate
