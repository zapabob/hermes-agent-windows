name: Windows semantic adoption audit
on:
  push:
    branches: [feat/windows-semantic-adoption-20260917]
    paths: [.github/workflows/windows-semantic-adoption-audit.yml]
permissions:
  contents: read
concurrency:
  group: windows-semantic-adoption-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Inspect frozen native worktrees
        shell: python
        run: |
          import os, pathlib, subprocess
          def git(*args):
              result = subprocess.run(['git', *args], capture_output=True, text=True, encoding='utf-8')
              if result.returncode:
                  raise RuntimeError(result.stderr[-1500:])
              return result.stdout
          git('config', 'core.longpaths', 'true')
          pins = {'downstream': '4aba35ed84aa8096c7394f0d26538bcdcdcab769',
                  'upstream': '260da4ef6251b29aa830c8c949dbe7c92d58df5f'}
          files = {}
          for label, sha in pins.items():
              remote = 'origin' if label == 'downstream' else 'https://github.com/NousResearch/hermes-agent.git'
              git('fetch', '--quiet', '--no-tags', '--depth=1', remote, sha)
              root = pathlib.Path(os.environ['RUNNER_TEMP']) / ('semantic adoption ' + label)
              git('worktree', 'add', '--quiet', '--detach', str(root), sha)
              assert git('-C', str(root), 'rev-parse', 'HEAD').strip() == sha
              names = git('-C', str(root), 'ls-files', '-z').split('\0')
              files[label] = {n: root / n for n in names if n.endswith('.py') and n.split('/')[0] in {'agent','hermes_cli','tools','plugins','downstream'}}
          terms = {'plugins': ('plugin',), 'mcp': ('mcp',),
                   'memory': ('memory_provider','memory_manager','memory_context','memory_checkpoint'),
                   'router': ('router','routing','fallback'),
                   'cache': ('cache','prompt_builder','turn_context')}
          for area, needles in terms.items():
              rows = []
              for name in sorted(set(files['downstream']) | set(files['upstream'])):
                  if not any(term in name.lower() for term in needles):
                      continue
                  d = files['downstream'].get(name); u = files['upstream'].get(name)
                  db = d.read_bytes() if d and d.is_file() else None
                  ub = u.read_bytes() if u and u.is_file() else None
                  if db == ub:
                      continue
                  tag = 'UPSTREAM_ONLY' if db is None else 'DOWNSTREAM_ONLY' if ub is None else 'DIFF'
                  rows.append(tag + ' ' + name)
              msg = '\n'.join(rows[:65]) + '\nTOTAL=' + str(len(rows)) + '; INVENTORY_NOT_PARITY'
              msg = msg.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::warning title=' + area + ' inventory::' + msg)
          for label in pins:
              root = pathlib.Path(os.environ['RUNNER_TEMP']) / ('semantic adoption ' + label)
              assert not git('-C', str(root), 'status', '--porcelain').strip()
          print('Native detached worktrees verified; no production mutation.')
