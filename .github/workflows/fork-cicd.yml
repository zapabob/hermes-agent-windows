name: Windows Workstation Tier-1 CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-workstation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.9.28"

defaults:
  run:
    shell: pwsh

jobs:
  downstream-policy:
    name: Downstream policy
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Fetch frozen upstream snapshot
        run: |
          $snapshot = Get-Content -Raw -LiteralPath .codex/UPSTREAM_SNAPSHOT.json | ConvertFrom-Json
          $snapshotSha = [string]$snapshot.upstream_head_sha
          git cat-file -e "$snapshotSha^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags https://github.com/NousResearch/hermes-agent.git $snapshotSha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git cat-file -e "$snapshotSha^{commit}"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra dev
      - name: Validate policy, feature, carry, and snapshot ledgers
        run: uv run --no-sync python scripts/downstream/validate_policy.py
      - name: Validate carry-surface metrics
        run: uv run --no-sync python scripts/downstream/carry_metrics.py --check
      - name: Validate required CI structure
        run: uv run --no-sync python -m pytest tests/downstream/test_ci_contracts.py -q
      - name: Enforce compatibility boundary layout
        run: |
          if (Test-Path -LiteralPath platform -PathType Container) {
            throw 'The legacy platform directory must not exist'
          }
          foreach ($required in @(
            'downstream/compat/hermes',
            'downstream/platform/windows',
            'downstream/services'
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Container)) {
              throw "Required compatibility boundary is missing: $required"
            }
          }

  windows-native-python:
    name: Windows native Python
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: python-version
        name: Derive Python version from pyproject.toml
        shell: pwsh
        run: |
          $content = Get-Content -Raw -LiteralPath pyproject.toml
          $match = [regex]::Match($content, 'requires-python\s*=\s*">=([0-9]+\.[0-9]+)')
          if (-not $match.Success) { throw 'Could not derive requires-python lower bound' }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ steps.python-version.outputs.version }}
      - name: Install locked Python environment
        run: uv sync --locked --python ${{ steps.python-version.outputs.version }} --extra all --extra dev
      - name: Python lint
        run: uv run --no-sync ruff check .
      - name: Windows footgun scan
        run: uv run --no-sync python scripts/check-windows-footguns.py --all
      - name: Install ClamAV for workstation malware qualification
        run: |
          choco install clamav -y --no-progress
          $packageTools = Join-Path $env:ChocolateyInstall 'lib\clamav\tools'
          $clamRoot = Get-ChildItem -LiteralPath $packageTools -Directory |
            Where-Object { $_.Name -like 'clamav-*.win.x64' } |
            Sort-Object Name |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $clamRoot) {
            throw 'ClamAV package directory was not found'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $clamRoot 'clamscan.exe'))) {
            throw 'ClamAV installation did not provide clamscan.exe'
          }
          $env:Path = "$clamRoot;$env:Path"
          $sample = Join-Path $clamRoot 'conf_examples\freshclam.conf.sample'
          $config = Join-Path $clamRoot 'freshclam.conf'
          $database = Join-Path $clamRoot 'database'
          New-Item -ItemType Directory -Force -Path $database | Out-Null
          $content = Get-Content -Raw -LiteralPath $sample
          $content = [regex]::Replace($content, '(?m)^Example\s*$', '# Example')
          $content += "`nDatabaseDirectory `"$database`"`nCVDCertsDirectory `"$(Join-Path $clamRoot 'certs')`"`n"
          Set-Content -LiteralPath $config -Value $content -Encoding utf8
          & (Join-Path $clamRoot 'freshclam.exe') --config-file=$config --datadir=$database
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PATH=$clamRoot;$env:PATH" >> $env:GITHUB_ENV
          "CLAMAV_DATABASE_DIR=$database" >> $env:GITHUB_ENV
          "HERMES_REQUIRE_CLAMAV=1" >> $env:GITHUB_ENV
      - name: Cross-platform and native Windows contracts
        run: >-
          uv run --no-sync python -m pytest
          tests/downstream/test_upstream_api_contracts.py
          tests/downstream/test_windows_contracts.py
          tests/tools/test_file_operations_windows_paths.py
          tests/tools/test_local_env_windows_msys.py
          tests/tools/test_windows_native_support.py
          tests/test_windows_subprocess_no_window_flags.py
          tests/test_desktop_update_windows_pipe_drain.py
          tests/test_go_watchdog_launcher_authority.py
          tests/tools/test_mcp_stdio_encoding_handler.py
          tests/tools/test_mcp_stdio_init_timeout.py
          tests/tools/test_mcp_stdio_watchdog.py
          tests/cron/test_sessiondb_init_hang.py
          tests/gateway/test_async_session_db.py
          tests/gateway/test_multiplex_session_db_profile_scope.py
          tests/test_hermes_state_wal_fallback.py
          tests/hermes_cli/test_fallback_chain.py
          tests/gateway/test_local_model_connection_reply.py
          tests/security/test_security_center.py
          tests/security/test_security_api.py
          -q

  windows-native-desktop:
    name: Windows native Desktop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: node-version
        name: Derive Node version and package manager
        shell: pwsh
        run: |
          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $match = [regex]::Match($package.engines.node, '>=([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success) { throw 'Could not derive Node engine version' }
          if (-not (Test-Path -LiteralPath package-lock.json)) { throw 'package-lock.json is required' }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          "manager=npm" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
      - name: Frozen npm install
        run: npm ci --no-audit --no-fund
      - name: Desktop typecheck
        run: npm --workspace apps/desktop run typecheck
      - name: Desktop lint
        run: npm --workspace apps/desktop run lint
      - name: Desktop platform and Electron child-process tests
        run: npm --workspace apps/desktop run test:desktop:platforms
      - name: Security Center UI tests
        run: npm --workspace apps/desktop run test:ui -- src/app/security/index.test.tsx
      - name: Desktop build smoke
        run: npm --workspace apps/desktop run build

  windows-watchdog-go:
    name: Windows watchdog Go
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: scripts/windows/watchdog-go/go.mod
          cache-dependency-path: scripts/windows/watchdog-go/go.sum
      - name: Native watchdog tests
        working-directory: scripts/windows/watchdog-go
        run: go test ./...
      - name: Native watchdog vet
        working-directory: scripts/windows/watchdog-go
        run: go vet ./...
      - name: Build Windows watchdog artifact
        working-directory: scripts/windows/watchdog-go
        run: go build -trimpath -o hermes-watchdog.exe .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-watchdog-windows
          path: scripts/windows/watchdog-go/hermes-watchdog.exe
          if-no-files-found: error

  upstream-api-compat:
    name: Upstream API compatibility
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra dev
      - run: uv run --no-sync python -m pytest tests/downstream/test_upstream_api_contracts.py -q

  windows-regression:
    name: Windows regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra all --extra dev
      - name: Upstream and composed regression contracts
        run: >-
          uv run --no-sync python -m pytest
          tests/upstream/test_snapshot_sync.py
          tests/agent/test_codex_cloudflare_headers.py
          tests/agent/test_terminal_env_registry.py
          tests/gateway/test_platform_base.py
          tests/tools/test_terminal_tool.py
          tests/plugins/test_semantic_graph_registration.py
          tests/plugins/test_ebbinghaus_plugin.py
          tests/run_agent/test_provider_fallback.py
          -q

  security-locks:
    name: Security and lockfiles
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: scripts/windows/watchdog-go/go.mod
          cache-dependency-path: scripts/windows/watchdog-go/go.sum
      - run: uv python install 3.11
      - name: Locked dependency graph must be current
        run: uv lock --check
      - name: Python dependency advisory audit
        run: |
          $requirements = Join-Path $env:RUNNER_TEMP 'hermes-audit-requirements.txt'
          uv export --frozen --all-extras --no-dev --no-emit-project --no-header --output-file $requirements | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uvx --from pip-audit==2.10.1 pip-audit --require-hashes --disable-pip --requirement $requirements
      - name: Node production dependency advisory audit
        run: npm audit --omit=dev --audit-level=high
      - name: Go module integrity
        working-directory: scripts/windows/watchdog-go
        run: go mod verify
