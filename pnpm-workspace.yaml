packages:
  - 'apps/*'
  - 'ui-tui'
  - 'ui-tui/packages/*'
  - 'web'
  - 'tests-js'

# pnpm expresses the same 14-day resolution quarantine in minutes.
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  - electron
  - sanitize-html
  - follow-redirects
  - dompurify
  - ip-address
  - postcss
  - vitest
  - '@vitest/*'
  - vite
  # Required native bundler closure of the reviewed Vite security release.
  - rolldown
  - '@rolldown/binding-*'
  - '@oxc-project/types'
  # Reviewed advisory floors (undici / fast-uri / zod / deepmerge).
  - undici
  - fast-uri
  - zod
  - deepmerge

allowBuilds:
  agent-browser: set this to true or false

overrides:
  # tar <7.5.21 is affected by the open Dependabot security advisories.
  # Keep pnpm's graph aligned with the existing npm override at the root.
  tar: 7.5.22
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
