name: nimble-scorer
version: 0.1.0
description: "Schema-driven enum/boolean scoring against a local GGUF served by llama.cpp. Returns typed decisions with per-choice probabilities in one forward pass per field, as a Jev replacement."
kind: standalone
author: "zapabob (port), based on bespokelabsai/nimble"
upstream: "https://github.com/bespokelabsai/nimble"
config:
  base_url:
    type: string
    default: "http://127.0.0.1:8080"
    description: "llama-server OpenAI-compatible endpoint serving the scoring GGUF."
  n_probs:
    type: integer
    default: 20000
    description: "Top-logprob rows requested per field. Must exceed the rank of the last candidate; raise it if a score call reports candidates outside the top-k."
  max_input_tokens:
    type: integer
    default: 8192
    description: "Prompt token ceiling per field. Prompts over the limit are rejected, never truncated."
  timeout_seconds:
    type: integer
    default: 180
    description: "HTTP timeout for scoring and status requests."
