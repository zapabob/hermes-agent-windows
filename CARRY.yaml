carry:
  - id: terminal-environment-provider-bridge
    upstream_paths: [tools/terminal_tool.py, tools/environments/base.py]
    downstream_reason: preserve plugin terminal backends through the official environment selection path
    invariants: [one terminal authority, profile-scoped provider registration]
    tests: [tests/agent/test_terminal_env_registry.py, tests/tools/test_terminal_tool.py]
    integration_policy: COMPOSE
  - id: windows-docker-media-paths
    upstream_paths: [gateway/platforms/base.py]
    downstream_reason: preserve native Windows host translation while adopting upstream multi-sandbox media roots
    invariants: [PurePosixPath for container paths, profile and session isolation]
    tests: [tests/gateway/test_platform_base.py]
    integration_policy: COMPOSE
  - id: desktop-preview-surface-separation
    upstream_paths: [apps/desktop/src/store/preview.ts, apps/desktop/src/app/chat/preview-tile.tsx]
    downstream_reason: retain separate Browser and file preview behavior through official pane ownership
    invariants: [explicit new Browser tabs, one stable file-preview zone]
    tests: [apps/desktop/src/store/preview.test.ts, apps/desktop/src/app/chat/preview-tile.test.ts]
    integration_policy: COMPOSE
  - id: watchdog-backend-prewarm
    upstream_paths: [apps/desktop/electron/main.ts, apps/desktop/electron/primary-backend-startup.ts]
    downstream_reason: consume the watchdog-owned backend manifest without creating another backend owner
    invariants: [Go watchdog is outer restart authority, official backend claim remains authoritative]
    tests: [apps/desktop/electron/backend-claim.test.ts, apps/desktop/electron/primary-backend-startup.test.ts]
    integration_policy: COMPOSE
  - id: windows-watchdog-lifecycle-fence
    upstream_paths: [hermes_cli/update_cmd.py, hermes_cli/uninstall.py, tools/approval.py]
    downstream_reason: suppress the independent Windows watchdog while official update and uninstall owners perform planned process mutation
    invariants: [maintenance lease is identity-bound and expiring, uninstall decommission requires operator elevation, failed recovery remains fenced]
    tests: [tests/hermes_cli/test_watchdog_maintenance.py, tests/hermes_cli/test_watchdog_lifecycle.py, tests/tools/test_hardline_blocklist.py]
    integration_policy: COMPOSE
    removal_condition: official update and uninstall lifecycle provides an equivalent external-watchdog maintenance contract
  - id: codex-cloudflare-routing
    upstream_paths: [agent/agent_init.py]
    downstream_reason: preserve Codex Cloudflare routing headers while following the effective official base URL
    invariants: [no credential logging, official client construction remains authoritative]
    tests: [tests/agent/test_codex_cloudflare_headers.py]
    integration_policy: COMPOSE
  - id: updater-noninteractive-network-git
    upstream_paths: [hermes_cli/update_cmd.py]
    current_upstream_owner: hermes_cli.update_cmd._git_run(network=True)
    downstream_reason: reuse the centralized subprocess prompt guard until the official updater decomposition is adopted
    invariants: [network Git never inherits stdin, configured credential helpers remain available]
    tests: [tests/hermes_cli/test_update_fetch_failure_classifier.py, tests/hermes_cli/test_noninteractive_git.py]
    integration_policy: COMPOSE
    removal_condition: adopt the official updater decomposition with the shared noninteractive Git helper intact
  - id: desktop-link-title-popup-fail-closed
    upstream_paths: [apps/desktop/electron/link-title-window.ts]
    current_upstream_owner: apps/desktop/electron.createLinkTitleWindow
    downstream_reason: require popup denial before loading arbitrary pages even when another webContents API fails
    invariants: [unguarded title windows are destroyed, audio mute remains best effort]
    tests: [apps/desktop/electron/link-title-window.test.ts]
    integration_policy: COMPOSE
    removal_condition: upstream independently fails closed when setWindowOpenHandler cannot be installed
  - id: desktop-operator-startup-pages
    upstream_paths: [hermes_cli/config_defaults.py, apps/desktop/electron/main.ts, apps/desktop/electron/startup-external-urls.ts]
    current_upstream_owner: desktop profile configuration and OS external URL handoff
    downstream_reason: let an operator open private-session X and YouTube pages at Desktop startup without shipping account URLs or restricting browser automation
    invariants: [public defaults contain no destination, values are profile-scoped config not environment variables, only credential-free HTTPS URLs on validated service hosts open once through the OS browser]
    tests: [apps/desktop/electron/startup-external-urls.test.ts]
    integration_policy: COMPOSE
    removal_condition: upstream provides an equivalent profile-scoped startup-page configuration with no account-specific defaults
  - id: windows-desktop-handle-bound-teardown
    upstream_paths: [apps/desktop/electron/backend-child.ts, apps/desktop/electron/backend-claim.ts, apps/desktop/electron/backend-release-gate.ts, apps/desktop/electron/main.ts]
    downstream_reason: authorize Windows Desktop backend termination only through retained ChildProcess handles
    invariants: [no PID-only destructive claim, no taskkill in Desktop backend ownership, update aborts while managed processes linger]
    tests: [apps/desktop/electron/backend-claim.test.ts, apps/desktop/electron/windows-child-options.test.ts, apps/desktop/electron/backend-release-gate.test.ts]
    integration_policy: COMPOSE
    removal_condition: upstream Desktop backend ownership uses an equivalent non-reopenable kernel-handle authority contract
  - id: windows-conpty-pty-ownership
    upstream_paths: [hermes_cli/win_pty_bridge.py, hermes_cli/pty_bridge.py, hermes_cli/pty_session.py, hermes_cli/web_server.py]
    current_upstream_owner: async WinPtyBridge/PtyBridge.write with timeout + PtySession attach generation
    downstream_reason: carry upstream ConPTY input backpressure and PTY ownership generation on the native Windows bridges without adopting COMPAT_MANIFEST layout
    invariants: [async write with timeout, socket lifetime != PTY lifetime, WS 1013 stalls close only the terminal socket, HERMES_PTY_HOST=dashboard]
    tests: [tests/downstream/test_upstream_windows_semantic_contracts.py, tests/hermes_cli/test_win_pty_bridge.py, web/src/lib/pty-focus.test.ts]
    integration_policy: PORT
    removal_condition: upstream async ConPTY write and attach-generation contracts land on main and pass the same Windows observability suite
  - id: windows-staged-desktop-promotion-locks
    upstream_paths: [apps/desktop/scripts/before-pack.mjs, hermes_cli/main.py]
    current_upstream_owner: install-scoped Desktop quiesce before live release rename (upstream main_desktop.py stage-and-swap)
    downstream_reason: compose the same re-quiesce + second wait_procs semantics into in-place pack and CLI stop helpers without inventing main_desktop.py
    invariants: [install-scoped exe only, no PID-only taskkill, second bounded wait after escalate kill, unresolved lock fails closed]
    tests: [apps/desktop/scripts/before-pack.test.mjs, tests/downstream/test_upstream_windows_semantic_contracts.py]
    integration_policy: COMPOSE
    removal_condition: upstream in-place Windows pack path provides equivalent install-scoped lock release before promotion
  - id: windows-remote-artifact-unc-fail-closed
    upstream_paths: [apps/desktop/electron/gateway-file-download.ts, apps/desktop/src/app/artifacts/artifact-utils.ts, apps/desktop/src/lib/media.ts]
    current_upstream_owner: gateway-owned remote path resolution with originating session/profile
    downstream_reason: keep tilde/relative paths gateway-owned and preserve fork UNC fail-closed while carrying session/profile provenance on downloads
    invariants: [no Windows client cwd expansion for remote ~/ ./ ../, sessionId and profile on download bridge, UNC rejected fail-closed]
    tests: [apps/desktop/electron/gateway-file-download.test.ts, apps/desktop/src/app/artifacts/remote-open.test.tsx]
    integration_policy: COMPOSE
    removal_condition: upstream Desktop remote download bridge matches session/profile provenance and Windows UNC fail-closed
  - id: desktop-browser-chrome-edge-handoff
    upstream_paths: [apps/desktop/src/lib/browser-deeplink.ts, apps/desktop/src/lib/deeplink-routes.ts, apps/desktop/src/app/contrib/hooks/use-desktop-integrations.ts, apps/desktop/electron/main.ts]
    current_upstream_owner: hermes://open/browser deep-link to in-app Browser pane
