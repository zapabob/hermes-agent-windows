[project]
name = "hakua-epistemic-r3-qlora-pilot"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.10.0+cu128", "transformers==4.55.4", "peft==0.17.1",
  "bitsandbytes==0.48.1", "accelerate==1.10.1", "safetensors==0.6.2",
  "huggingface-hub==0.34.4", "numpy==2.2.6", "pydantic==2.13.4",
]
[dependency-groups]
dev = ["pytest==8.4.1", "black==25.1.0", "flake8==7.2.0"]
[tool.uv]
package = false
# CUDA Torch is borrowed read-only from the existing Python 3.10 runtime.
# Do not uv sync this experiment: use the documented .venv-cuda overlay.
