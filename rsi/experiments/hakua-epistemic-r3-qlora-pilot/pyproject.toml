[project]
name = "hakua-epistemic-r3-qlora-pilot"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.13.0+cu130", "transformers==5.17.0", "peft==0.21.2",
  "bitsandbytes==0.48.1", "accelerate==1.15.0+hermes.1", "safetensors==0.8.0",
  "huggingface-hub==1.33.0", "numpy==2.2.6", "pydantic==2.13.4",
]
[dependency-groups]
dev = ["pytest==9.0.3", "black==26.10.1", "flake8==7.2.0"]
[tool.uv]
package = false
# Install into a new dedicated environment; keep historical .venv-cuda intact.
# secure_runtime.py checks the installed closure and frozen historical inputs.
# setuptools floor for GHSA-xmj3-9gf7-h52w. filelock>=4.2.1 needs Python>=3.11,
# so pin 4.1.0 (override) and ignore those CVEs in fork-cicd pilot pip-audit
# until the pilot moves off the CPython 3.10 / cp310 Torch freeze.
constraint-dependencies = [
  "setuptools>=84.1.0",
]
override-dependencies = [
  "filelock==4.1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
accelerate = { path = "vendor/accelerate-1.15.0+hermes.1-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
